<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" fill="none">
  <defs>
    <!-- Amber / Gold Metallic Gradients -->
    <linearGradient id="amberHexTop" x1="110" y1="520" x2="528" y2="48" gradientUnits="userSpaceOnUse">
