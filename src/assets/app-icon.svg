        <path d="M670 588 C738 476 808 392 892 334" stroke="url(#blueGrooveLight)" stroke-width="2.8"/>

        <path d="M626 672 C682 562 752 478 852 414" stroke="url(#blueGrooveDark)" stroke-width="9"/>
        <path d="M629 676 C685 566 755 482 855 418" stroke="url(#blueGrooveLight)" stroke-width="3.6"/>

        <path d="M604 718 C658 614 726 532 820 470" stroke="url(#blueGrooveDark)" stroke-width="8.5"/>
        <path d="M607 722 C661 618 729 536 823 474" stroke="url(#blueGrooveLight)" stroke-width="3.2"/>

        <path d="M586 764 C638 666 704 588 790 530" stroke="url(#blueGrooveDark)" stroke-width="8"/>
        <path d="M589 768 C641 670 707 592 793 534" stroke="url(#blueGrooveLight)" stroke-width="3"/>

        <path d="M566 820 C606 728 666 654 748 598" stroke="url(#blueGrooveDark)" stroke-width="8.5"/>
        <path d="M569 824 C609 732 669 658 751 602" stroke="url(#blueGrooveLight)" stroke-width="3.2"/>

        <path d="M558 858 C592 778 644 714 714 664" stroke="url(#blueGrooveDark)" stroke-width="7.5"/>
        <path d="M561 862 C595 782 647 718 717 668" stroke="url(#blueGrooveLight)" stroke-width="2.8"/>

        <path d="M554 880 C580 820 622 768 678 726" stroke="url(#blueGrooveDark)" stroke-width="6.5"/>
        <path d="M557 883 C583 823 625 771 681 729" stroke="url(#blueGrooveLight)" stroke-width="2.4"/>
