    <path d="M474 183 L528 286 L528 304 L472 204 Z" fill="#9c6022" opacity="0.58"/>
    <path d="M49 551 L236 577 L257 540 L309 688 L398 509 L392 536 L307 704 L256 560 L234 590 Z" fill="#3a1c06" opacity="0.9"/>
    <path d="M426 452 L549 686 L592 608 L581 605 L548 666 L432 446 Z" fill="#63360e" opacity="0.82"/>
