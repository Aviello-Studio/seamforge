    <line x1="528" y1="39" x2="528" y2="114" stroke="#22170d" stroke-width="2.5" opacity="0.6"/>
    <line x1="528" y1="909" x2="528" y2="984" stroke="#22170d" stroke-width="2.5" opacity="0.6"/>
    <line x1="528" y1="286" x2="528" y2="492" stroke="#1e2d3d" stroke-width="2" opacity="0.38"/>
  </g>

