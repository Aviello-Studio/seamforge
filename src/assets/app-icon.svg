      <stop offset="38%" stop-color="#c98740"/>
      <stop offset="76%" stop-color="#e7b267"/>
      <stop offset="100%" stop-color="#f9dfa4"/>
    </linearGradient>
    <linearGradient id="amberHexBot" x1="112" y1="580" x2="528" y2="975" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b97834"/>
      <stop offset="45%" stop-color="#9e6024"/>
      <stop offset="100%" stop-color="#6b3b12"/>
    </linearGradient>
    <linearGradient id="amberWave" x1="110" y1="670" x2="540" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#91531c"/>
      <stop offset="35%" stop-color="#c68139"/>
      <stop offset="68%" stop-color="#e5ae63"/>
      <stop offset="100%" stop-color="#f6d591"/>
