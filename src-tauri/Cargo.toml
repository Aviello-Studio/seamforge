[package]
name = "seamforge"
version = "2.0.0"
description = "Precision desktop studio for seamless musical audio loops"
authors = ["Aviello Studio"]
license = "MIT"
repository = "https://github.com/Aviello-Studio/seamforge"
edition = "2024"
rust-version = "1.90"

[lib]
name = "seamforge_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
symphonia = { version = "0.6", features = ["all"] }
rustfft = "6.4"
rayon = "1.12"
cpal = { version = "0.18", features = ["realtime"] }
hound = "3.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
